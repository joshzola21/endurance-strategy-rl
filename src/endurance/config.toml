# The app's colourway and typography, in one file.
#
# Nothing here changes a number. If anything in this file can alter what the
# app computes, it is in the wrong file.
#
# **Two palettes, not one.** These options reach every Streamlit widget and
# reach `viz.py` not at all: `st.pyplot` renders a matplotlib figure that was
# already drawn. The chart colours below therefore apply only to Streamlit's
# own charts, of which this app draws none, and are set so that a chart added
# later does not arrive in a different palette. The charts you can actually
# see are `src/endurance/viz.py`, which carries the same hexes and is shared
# with the notebooks.
#
# **Light only, deliberately.** Streamlit offers the reader a dark theme
# through the settings menu when one is defined. Defining one would put a
# light matplotlib figure in the middle of a dark page, because `viz.py` is
# also a notebook module and cannot read this file. `base = "light"` and no
# `[theme.dark]` table means the toggle does not appear.
#
# Contrast, measured rather than judged, against `backgroundColor`:
#   textColor      #2A2730   13.6:1
#   linkColor      #7A57BC    5.4:1   passes AA for body text
#   captions       #6E6A78    4.9:1   passes AA for body text
#   primaryColor   #8968CD    4.0:1   fills, borders and focus rings only
#
# The last line is the constraint the whole palette is built around.
# `#8968CD` is 4.26:1 on white, so it cannot carry body text in either
# direction. It is an accent. `linkColor` is the darkened counterpart, and it
# is what any purple *text* uses.

[theme]
base = "light"

primaryColor = "#8968CD"
backgroundColor = "#F7F6FA"
secondaryBackgroundColor = "#EFEDF3"
textColor = "#2A2730"

linkColor = "#7A57BC"
linkUnderline = true

codeTextColor = "#5E4B8C"
codeBackgroundColor = "#EFEDF3"

borderColor = "#DCD8E4"
dataframeBorderColor = "#DCD8E4"
dataframeHeaderBackgroundColor = "#EFEDF3"
showWidgetBorder = true

baseRadius = "0.4rem"
buttonRadius = "0.4rem"

# IBM Plex, for a reason rather than a taste: this app is mostly tables and
# `st.metric`, and Plex Sans has proper tabular figures, so a column of
# lap times does not shuffle sideways as the digits change. Plex Mono is the
# same family, so a fingerprint printed in code type sits beside its label
# instead of arguing with it.
#
# Loaded from Google's CSS endpoint rather than from `static/`, which keeps
# the repository free of font binaries and needs no `enableStaticServing`.
# The fallback after the comma is what shows if Google is unreachable.
font = "IBM-Plex-Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM-Plex-Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&display=swap, sans-serif"
codeFont = "IBM-Plex-Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"

baseFontSize = 16
headingFontWeights = [700, 600, 600]

# The headline numbers on the race page. Smaller than Streamlit's 2.25rem
# default because there are six of them across one row and they wrap on a
# laptop at the default size.
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

# For Streamlit's own charts. `viz.py` carries these same values; see the
# note at the top about why this file cannot reach it.
chartCategoricalColors = [
    "#8968CD", "#3E8A8F", "#C8663C", "#4A6BB5",
    "#9C5A8C", "#7A8C3F", "#B8963C", "#6E6A78",
]
chartSequentialColors = [
    "#F2EEF9", "#E2D9F2", "#CFC0E8", "#BBA6DE", "#A88DD4",
    "#9575CA", "#7F5CB6", "#68489A", "#52397A", "#3C2A5A",
]
chartDivergingColors = [
    "#7A3E1F", "#9C5029", "#C8663C", "#DB9576", "#EDCABA",
    "#DDD6EB", "#BBA6DE", "#9575CA", "#7F5CB6", "#5E4490",
]

[theme.sidebar]
backgroundColor = "#EFEDF3"
secondaryBackgroundColor = "#F7F6FA"
borderColor = "#DCD8E4"

[client]
# Hides "Fork this app" and the developer options from the hamburger. A
# visitor arriving from a link is a reader, not a maintainer.
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
# Not presentation, and here because it belongs with the other four lines
# nobody wants to remember: `streamlit run` stops opening a browser tab and
# stops asking for an email address the first time it is run in a fresh
# checkout. Delete it if you would rather the tab opened.
headless = true
